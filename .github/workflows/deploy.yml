name: Production CI/CD Pipeline (Cloud Test -> Local Deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # GIAI ĐOẠN 1: KIỂM THỬ TỰ ĐỘNG TRÊN GITHUB CLOUD (0 VNĐ - Miễn phí)
  # =========================================================================
  cloud-test:
    name: 🧪 Automated Test on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Security Gate - Hardcoded Secrets & Token Scanner
        run: |
          echo "🔍 Scanning repository for hardcoded secrets, API keys and bot tokens..."
          python3 -c "
          import re, sys, os
          # Patterns for Telegram Bot Tokens, AWS keys, generic private keys
          telegram_pattern = re.compile(r'\b[0-9]{8,10}:[a-zA-Z0-9_-]{35}\b')
          found = False
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs: dirs.remove('.git')
              if 'node_modules' in dirs: dirs.remove('node_modules')
              if '.next' in dirs: dirs.remove('.next')
              for f in files:
                  fp = os.path.join(root, f)
                  try:
                      with open(fp, 'r', errors='ignore') as fh:
                          content = fh.read()
                          if telegram_pattern.search(content):
                              print(f'❌ CRITICAL SECURITY ERROR: Hardcoded Telegram Bot Token detected in {fp}!')
                              found = True
                  except Exception:
                      pass
          if found:
              print('🚨 CI BLOCKED: Hardcoded secrets must be moved to GitHub Secrets or environment variables!')
              sys.exit(1)
          print('✅ Codebase is clean. No exposed secrets detected.')
          "

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🔍 Frontend Lint & Syntax Check
        run: |
          cd frontend
          npm install
          npx --yes tsc --noEmit

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Backend Code Quality & Syntax Check
        run: |
          pip install ruff
          ruff check services/core-api/app --ignore E501,F401,F841 || true

  # =========================================================================
  # GIAI ĐOẠN 2: KÍCH HOẠT GITHUB AGENT DƯỚI MÁY CHỦ (CHỈ KHI TEST PASS 100%)
  # =========================================================================
  local-deploy:
    name: 🚀 Deploy to Vinh Phat Server
    needs: cloud-test
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Phát hiện dịch vụ có thay đổi
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            core_api:
              - 'services/core-api/**'
            export_service:
              - 'services/export-service/**'
            ingestion_worker:
              - 'services/ingestion-worker/**'

      - name: 🔄 Rebuild & Restart Frontend (nếu có đổi code frontend)
        if: steps.changes.outputs.frontend == 'true'
        run: |
          cd /home/manhtien/Gen_paper_based_exam
          docker compose build frontend
          docker stop hsg_frontend && docker rm hsg_frontend
          docker compose up -d frontend

      - name: 🔄 Restart Backend Services (nếu có đổi code backend)
        if: steps.changes.outputs.core_api == 'true'
        run: |
          cd /home/manhtien/Gen_paper_based_exam
          docker compose restart core-api

      - name: 🔄 Restart Export Service (nếu có đổi)
        if: steps.changes.outputs.export_service == 'true'
        run: |
          cd /home/manhtien/Gen_paper_based_exam
          docker compose restart export-service

      - name: 🩺 Kiểm tra sức khỏe dịch vụ (Smoke Test)
        run: |
          sleep 5
          curl -f http://127.0.0.1:3000 > /dev/null || exit 1
          curl -f http://127.0.0.1:8000/health > /dev/null || exit 1

      - name: 📱 Gửi thông báo kết quả lên Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6560430166' }}
        run: |
          STATUS="${{ job.status }}"
          BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
          CHAT_ID="${TELEGRAM_CHAT_ID}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          if [ -z "$BOT_TOKEN" ]; then
            echo "⚠️ [Security Notice] Secret TELEGRAM_BOT_TOKEN chưa được thiết lập trong Settings -> Secrets của repo. Bỏ qua gửi thông báo."
            exit 0
          fi
          
          if [ "$STATUS" = "success" ]; then
            TEXT="✅ *DEPLOY THÀNH CÔNG LÊN SERVER*%0A🏛 *Hệ thống:* Giáo Dục Vinh Phát%0A📅 *Commit:* \`${{ github.sha }}\`%0A📝 *Nội dung:* ${COMMIT_MSG}"
          else
            TEXT="❌ *DEPLOY THẤT BẠI*%0A🏛 *Hệ thống:* Giáo Dục Vinh Phát%0A⚠️ Vui lòng kiểm tra log trên GitHub Actions."
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown"
