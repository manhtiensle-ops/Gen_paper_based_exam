title = "Vinh Phat Security - Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot Token Pattern"
regex = '''\b[0-9]{8,10}:[a-zA-Z0-9_-]{35}\b'''
tags = ["key", "telegram", "security"]

[allowlist]
description = "Global allowlist for build artifacts"
paths = [
  '''node_modules/''',
  '''\.next/''',
  '''dist/''',
  '''build/'''
]
